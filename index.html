<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAVA Publishing OS</title>
  <link rel="icon" type="image/png" href="assets/sava-logo.png" />
  <meta name="description" content="Publishing operating system for partner selection, deal making, market intelligence, game selection, sourcing and publishing operations." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=0.34" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="assets/sava-logo.png" alt="SAVA" /></div>
        <div><strong>SAVA</strong><span>Publishing OS</span></div>
      </div>
      <nav id="mainNav" class="nav"></nav>
      <div class="sidebar-footer">
        <button class="ghost full" data-action="account">👤 Tài khoản</button>
        <small id="saveState">Connecting to Supabase…</small>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="pageEyebrow">Publishing Operating System</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="top-actions">
          <input id="globalSearch" class="search" type="search" placeholder="Tìm Partner / Game / Project..." />
          <button class="ghost" data-action="refresh-cloud">↻ Làm mới</button>
          <button class="ghost" data-action="export-json">Xuất</button>
          <label class="ghost file-button">Nhập<input id="importJson" type="file" accept="application/json" /></label>
          <button class="primary" data-action="quick-add">+ Thêm</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <div id="authRoot" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=0.9"></script>
  <script src="supabase-data.js?v=0.29"></script>
  <script src="data/seed.js?v=0.9"></script>
  <script src="app.js?v=0.34" defer></script>
</body>
</html>
